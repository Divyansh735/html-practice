<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
        }

        table {
            width: 60%;
            border-collapse: collapse;
            margin: auto;
            background-color: white;
        }

        table, th, td {
            border: 1px solid black;
        }

        th {
            background-color: #1388cc;
            color: white;
            padding: 10px;
        }

        td {
            padding: 10px;
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:last-child {
            font-weight: bold;
            background-color: #ddd;
        }
    </style>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>NAME</th>
                <th>ROLE</th>
                <th>SALARY</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>John Doe</td>
                <td>Software Engineer</td>
                <td>$100,000</td>
            </tr>
            <tr>
                <td>Jane Smith</td>
                <td>Product Manager</td>
                <td>$120,000</td>
            </tr>
            <tr>
                <td>Emily Johnson</td>
                <td>UX Designer</td>
                <td>$90,000</td>
            </tr>
            <tr>
                <td colspan="2">Total</td>
                <td>$310,000</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
